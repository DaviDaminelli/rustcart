[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.19.0"
argon2 = "0.6.0"
diesel = { version = "2.3.14", features = ["postgres", "sqlite", "r2d2"] }
diesel_migrations = { version = "2.3.2", features = ["postgres", "sqlite"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
log = "0.4.35"
pq-sys = { version = "0.7.8", features = ["bundled_without_openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }
